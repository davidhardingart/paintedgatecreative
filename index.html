  >

  <link rel="stylesheet" href="styles.css">

  <style>
    @media (min-width: 900px) {
      .case-study {
        align-items: start;
      }

      .case-study-copy {
        padding-top: 110px;
      }

      .case-study.reverse .case-study-copy {
        padding-top: 110px;
      }
    }

    /* ========================================
       PROJECT INQUIRY FORM
    ========================================= */

    .project-form {
      width: min(900px, 100%);
      margin: 48px auto 0;
      text-align: left;
    }

    .project-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px 32px;
    }

    .project-field {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .project-field-full {
      grid-column: 1 / -1;
    }

    .project-field label {
      font-family: "Inter", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #2a2825;
    }

    .project-field input,
    .project-field select,
    .project-field textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(42, 40, 37, 0.18);
      border-radius: 0;
      background: rgba(255, 255, 255, 0.42);
      color: #1d1c1a;
      font-family: "Inter", sans-serif;
      font-size: 0.98rem;
      line-height: 1.5;
      padding: 16px 18px;
      outline: none;
      transition: border-color 160ms ease, background-color 160ms ease;
    }

    .project-field textarea {
      min-height: 180px;
      resize: vertical;
    }

    .project-field input::placeholder,
    .project-field textarea::placeholder {
      color: rgba(42, 40, 37, 0.48);
    }

    .project-field input:focus,
    .project-field select:focus,
    .project-field textarea:focus {
      border-color: #bd5732;
      background: rgba(255, 255, 255, 0.68);
    }

    .project-form-actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 22px;
      margin-top: 6px;
    }

    .project-form .button {
      border: 0;
      cursor: pointer;
    }

    .project-form .button[disabled] {
      cursor: wait;
      opacity: 0.65;
    }

    .form-status {
      margin: 0;
      font-family: "Inter", sans-serif;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #5f5a54;
    }

    .form-status.is-error {
      color: #9a3c26;
    }

    .form-status.is-success {
      color: #4b634e;
    }

    @media (max-width: 720px) {
      .project-form {
        margin-top: 36px;
      }

      .project-form-grid {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .project-field-full,
      .project-form-actions {
        grid-column: auto;
      }

      .project-form-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .project-form .button {
        width: 100%;
      }
    }
  </style>
</head>
